<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Chat Monitor — Kapruka Messenger Bot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="tabnav">
    <button class="tab-btn active" data-tab="chats">Chats</button>
    <button class="tab-btn" data-tab="images">Product Images</button>
  </nav>

  <div class="app" id="view-chats">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>Chats</h1>
        <label class="escalated-toggle">
          <input type="checkbox" id="escalatedOnly" />
          Escalated only
        </label>
      </div>
      <input type="text" id="search" placeholder="Search by name or ID..." />
      <div id="customerList" class="customer-list"></div>
    </aside>

    <main class="thread">
      <div id="threadHeader" class="thread-header">Select a conversation</div>
      <div id="threadMessages" class="thread-messages"></div>
    </main>
  </div>

  <div class="images-view" id="view-images" hidden>
    <div class="images-toolbar">
      <input type="text" id="productCodeInput" placeholder="Kapruka product code (= ad name)" />
      <button id="fetchImagesBtn">Fetch Images</button>
      <span id="fetchStatus" class="fetch-status"></span>
    </div>
    <div id="fetchSummary" class="fetch-summary"></div>

    <h2 class="section-title">Pending review (Daraz customer photos)</h2>
    <div id="pendingGrid" class="image-grid"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
